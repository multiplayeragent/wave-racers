  const ctl = !racing ? { steer: 0, gas: 0, brake: 1 } : ATTRACT ? botSteer(me, now) : { steer, gas: 1, brake: input.brake ? 1 : 0 };
  const wasAir = me.air, landed = stepSki(me, ctl, dt);
  if (landed > 6) { splash(me, landed); me.shake = Math.min(1, landed / 14); beep(140, 0.25, "sawtooth", 0.06); }
  if (!wasAir && me.air && racing && Math.hypot(me.vx, me.vz) > 20) toast("AIR!", 600);
  if (me.bonk > 4) { me.shake = 0.6; beep(90, 0.2, "square", 0.08); toast("Ouch, rocks!", 800, true); } me.bonk = 0;
  if (racing) {
    const lapDone = laps(me, r, (ok, gi) => {
      if (gi >= 0) { const bs = buoys.filter((b) => b.g === GATES[gi]); bs.forEach((b) => b.cap.material.color.set(ok ? "#52d273" : "#ff4d4d")); }
      if (ok) beep(880, 0.12); else { beep(160, 0.3, "square", 0.08); toast(`Missed a gate! +${CONFIG.missPenalty / 1000}s`, 1200, true); }
    });
    if (lapDone) {
      const lapMs = Date.now() - me.lapStart; me.lapStart = Date.now();
      for (const b of buoys) b.cap.material.color.set("#ffd23f");
      if (me.ft) { if (!me.best || me.ft < me.best) me.best = me.ft; toast(`Finished ${ord(racers().findIndex((x) => x.mine) + 1)}!`, 2500); beep(660, 0.15); setTimeout(() => beep(880, 0.15), 140); setTimeout(() => beep(1320, 0.35), 280); }
      else toast(me.lap === CONFIG.laps - 1 ? "Final lap!" : `Lap ${me.lap + 1}`, 1300);
    }
  }
  if (now - me.lastSend > 66) {
    me.lastSend = now;
    net.me.set("k", JSON.stringify({ r: me.raceId, x: +me.x.toFixed(2), y: +me.y.toFixed(2), z: +me.z.toFixed(2), h: +me.h.toFixed(2), vx: +me.vx.toFixed(1), vy: +me.vy.toFixed(1), vz: +me.vz.toFixed(1), a: me.air ? 1 : 0, l: me.lap, t: me.i, hf: me.half ? 1 : 0, ft: me.ft, pen: me.pen, s: +(me.steer || 0).toFixed(1) }));
  }
}
function splash(c, power) {
  emit(c.x, c.y + 0.3, c.z, 0, 4, 0, Math.min(60, 10 + power * 3), 10, 0.9);
}

// ── HUD & RESULTS ───────────────────────────────────────────────────────────────────
const $ = (id) => document.getElementById(id);
const ord = (n) => n + (n % 10 === 1 && n % 100 !== 11 ? "st" : n % 10 === 2 && n % 100 !== 12 ? "nd" : n % 10 === 3 && n % 100 !== 13 ? "rd" : "th");
const fmt = (ms) => `${Math.floor(ms / 60000)}:${String(Math.floor((ms % 60000) / 1000)).padStart(2, "0")}.${String(Math.floor((ms % 1000) / 10)).padStart(2, "0")}`;
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
let toastTimer = 0;
function toast(text, ms = 1500, bad) { if (ATTRACT) return; const m = $("msg"); m.textContent = text; m.classList.add("on"); m.classList.toggle("bad", !!bad); clearTimeout(toastTimer); toastTimer = setTimeout(() => m.classList.remove("on"), ms); }
let board = null, boardFor = -1, lastCount = "", started = 0;
function hud(r, now) {
  const t = Date.now();
  const count = r.phase === "grid" && r.startAt - t < 3000 ? String(Math.max(1, Math.ceil((r.startAt - t) / 1000))) : r.phase === "race" && t - r.startAt < 900 ? "GO!" : "";
  if (count !== lastCount) { lastCount = count; if (count === "GO!") beep(880, 0.4, "square", 0.08); else if (count) beep(440, 0.15, "square", 0.08); }
  $("count").textContent = count;
  if (ATTRACT) { for (const id of ["pos", "lap", "time", "net", "hint"]) $(id).textContent = ""; return; }
  const order = racers(), at = order.findIndex((x) => x.mine) + 1, missed = me.pen / CONFIG.missPenalty;
  $("pos").innerHTML = at ? `${ord(at)} <small>/ ${order.length}</small>` : "";
  $("lap").innerHTML = me.ft ? "Finished" : `Lap ${clamp(me.lap + 1, 1, CONFIG.laps)}/${CONFIG.laps} · gate ${(me.gi % GATES.length) + 1}/${GATES.length}${missed ? ` · <b>${missed} missed</b>` : ""}`;
  const raw = r.phase === "race" ? (me.ft || t - r.startAt) : 0;
  $("time").innerHTML = `${fmt(me.ft || raw + me.pen)}${me.pen ? `<small>+${me.pen / 1000}s penalties</small>` : ""}`;
  $("hint").textContent = r.phase === "grid" && r.startAt - t >= 3000 ? "Next race starting…" : me.ft && r.phase === "race" ? "Waiting for the others…" :
    now - started < 14000 ? (touchUI ? "◀ ▶ steer through the buoys · BRAKE to turn tight · you throttle on your own" : "←/→ steer through the buoys · ↓ or Space to brake and turn tight · you throttle on your own") : "";
  const n = livePlayers().length;
  $("net").textContent = net.offline ? "Offline: playing with bots" : dropped ? "Reconnecting…" : `Online · ${n} player${n === 1 ? "" : "s"}${isHost() ? " · you run the race" : ""}`;
  $("over").hidden = r.phase !== "done";
  if (r.phase === "done") {
    const win = r.results[0];
    $("otitle").textContent = win && win.ft ? (win.id === net.sessionId ? "You win!" : `${win.n} wins!`) : "Results";
    $("results").innerHTML = r.results.map((x) => `<li class="${x.id === net.sessionId ? "me" : ""}">${esc(x.n)}${x.pen ? `<em>+${x.pen / 1000}s</em>` : ""}<span>${x.ft ? fmt(x.ft) : "DNF"}</span></li>`).join("");
    $("next").textContent = `Next race in ${Math.max(0, Math.ceil((r.endsAt - t) / 1000))}s`;
    if (boardFor !== r.id) { boardFor = r.id; showBoard(r); }
  }
}
function showBoard(r) {
  const list = $("board");
  if (!board) { list.innerHTML = "<li class=\"note\">Leaderboards need a connection.</li>"; return; }
  const mine = r.results.find((x) => x.id === net.sessionId);
  const submit = mine && mine.ft && me.submitted !== r.id ? board.submit(Math.max(0, 600000 - mine.ft)).catch(() => null) : Promise.resolve();
  me.submitted = r.id;
  submit.then(() => board.top(10)).then(({ entries }) => {
    list.innerHTML = entries.length ? entries.map((e) => `<li>${esc(e.username || "Player")}<span>${fmt(600000 - e.score)}</span></li>`).join("") : "<li class=\"note\">No times yet. Set the first.</li>";
  }).catch(() => { list.innerHTML = "<li class=\"note\">Couldn't load the leaderboard.</li>"; });
}
function again() { const r = race(); if (r && r.phase === "done" && isHost()) newRace(r.id + 1); }
$("again").onclick = () => { if (isHost()) again(); else net.send("again", {}); };

// ── INPUT ───────────────────────────────────────────────────────────────────────────
const touchUI = matchMedia("(pointer: coarse)").matches && !ATTRACT;
$("padL").hidden = $("padR").hidden = !touchUI;
document.body.classList.toggle("touch", touchUI);
const wakeAudio = () => { if (!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch {} } };
const KEYS = { ArrowLeft: "left", a: "left", A: "left", ArrowRight: "right", d: "right", D: "right", ArrowDown: "brake", s: "brake", S: "brake", " ": "brake" };
addEventListener("keydown", (e) => { wakeAudio(); const k = KEYS[e.key]; if (k) { e.preventDefault(); input[k] = true; } });
addEventListener("keyup", (e) => { const k = KEYS[e.key]; if (k) input[k] = false; });
for (const b of document.querySelectorAll(".pad button")) {
  const k = b.dataset.k, on = (v) => { input[k] = v; b.classList.toggle("on", v); };
  b.addEventListener("pointerdown", (e) => { e.preventDefault(); wakeAudio(); b.setPointerCapture(e.pointerId); on(true); });
  for (const ev of ["pointerup", "pointercancel"]) b.addEventListener(ev, () => on(false));
}
renderer.domElement.addEventListener("pointerdown", wakeAudio);
document.addEventListener("touchmove", (e) => e.preventDefault(), { passive: false });

// ── MAIN LOOP ───────────────────────────────────────────────────────────────────────
const views = new Map(); // id -> drawn ski for everyone but me: { g, x, y, z, h, ... }
function viewOf(id, color, name) {
  let v = views.get(id);
  if (v && v.color !== color) { scene.remove(v.g); views.delete(id); v = null; } // they changed color
  if (!v) { v = { id, g: makeSki(color, ATTRACT ? "" : name), color, x: 0, y: 0, z: 0, h: 0, vx: 0, vz: 0, pitch: 0, raw: "", fresh: true, air: false }; views.set(id, v); }
  return v;
}
/** Ease a drawn ski toward where it said it was, plus how far it has gone since. */
function follow(v, k, dt, now, exact) {
  if (exact) { Object.assign(v, { x: k.x, y: k.y, z: k.z, h: k.h, vx: k.vx, vz: k.vz }); } else {
    const key = `${k.x},${k.z},${k.h}`;
    if (v.raw !== key) Object.assign(v, { raw: key, sx: k.x, sy: k.y, sz: k.z, sh: k.h, vx: k.vx || 0, vy: k.vy || 0, vz: k.vz || 0, at: now });
    const age = Math.min(0.25, (now - v.at) / 1000), tx = v.sx + v.vx * age, tz = v.sz + v.vz * age;
    if (v.fresh || Math.hypot(tx - v.x, tz - v.z) > 15) Object.assign(v, { x: tx, z: tz, h: v.sh, fresh: false });
    const e = 1 - Math.pow(0.001, dt);
    v.x += (tx - v.x) * e; v.z += (tz - v.z) * e; v.h = angle(v.h + angle(v.sh - v.h) * e);
    // height: on the water, sit on our own sea; in the air, follow the arc it sent
    const ty = k.a ? v.sy + v.vy * age - 0.5 * CONFIG.gravity * age * age : seaY(v.x, v.z);
    v.y += (Math.max(ty, seaY(v.x, v.z)) - v.y) * (k.a ? e : 1);
  }
  const [gx, gz] = seaSlope(v.x, v.z), fx = Math.sin(v.h), fz = Math.cos(v.h), sp = Math.hypot(v.vx, v.vz);
  const wantPitch = k.a ? clamp(Math.atan2(k.vy || 0, Math.max(8, sp)), -0.5, 0.6) : Math.atan(gx * fx + gz * fz);
  v.pitch += (wantPitch - v.pitch) * Math.min(1, dt * 6);
  if (v.air && !k.a) splash(v, 8);
  v.air = !!k.a; v.speed = sp; v.steer = k.s || 0;
}
/** Wake and turning spray behind a ski on the water. */
function wake(c, dt) {
  if (c.air || (c.speed || 0) < 6) return;
  const fx = Math.sin(c.h), fz = Math.cos(c.h), n = Math.random() < dt * 40 ? 1 : 0;
  if (n) emit(c.x - fx * 2, c.y + 0.2, c.z - fz * 2, -fx * 1.5, 1.5, -fz * 1.5, 1, 1.5, 0.7);
  if (Math.abs(c.steer || 0) > 0.3 && Math.random() < dt * 30) { const s = Math.sign(c.steer); emit(c.x - fz * s * 0.9, c.y + 0.3, c.z + fx * s * 0.9, -fz * s * 6, 3, fx * s * 6, 2, 2, 0.7); }
}
let last = performance.now(), lastHb = 0, lastHud = 0, camH = 0;
const camPos = new THREE.Vector3(), camLook = new THREE.Vector3();
function frame(now) {
  requestAnimationFrame(frame);
  const realNow = performance.now(); // timed on the real clock: after a long freeze the rAF time can be from before the wake
  if (lastFrameAt && realNow - lastFrameAt > 1000) { wakeHold = realNow + 700; host.wasHost = false; host.last = null; } lastFrameAt = realNow; // woke from a freeze or a background tab: another player may have run the race meanwhile, so let their state arrive, then adopt it like a new host
  const dt = Math.max(0, Math.min(0.05, (now - last) / 1000)); last = now; // the first frame can be stamped before `last`
  setWaveTime(Date.now() / 1000);
  if (now - lastHb > 1000) { lastHb = now; net.me.set("hb", Date.now()); fixColor(); }
  if (isHost()) hostTick(dt, now); else host.wasHost = false;
  const r = race();
  if (r) myTick(dt, r, now);
  // everyone else's skis
  const seen = new Set(), live = new Set(livePlayers());
  for (const [id, p] of Object.entries(S.entities.players || {})) {
    if (id === net.sessionId || !live.has(id)) continue;
    const k = parse(p.k, null); if (!k || !r || k.r !== r.id) continue;
    seen.add(id); const v = viewOf(id, p.c || "#ccc", p.n || "Player"); follow(v, k, dt, now, false);
    placeSki(v.g, v.x, v.y, v.z, v.h, v.pitch, -v.steer * 0.35); wake(v, dt);
  }
  const hostBots = isHost();
  for (const b of botList()) {
    seen.add(b.i); const v = viewOf(b.i, b.c, b.n);
    if (hostBots) { const hb = host.bots.get(b.i); Object.assign(v, { x: hb.x, y: hb.y, z: hb.z, h: hb.h, pitch: hb.pitch || 0, speed: hb.speed, steer: hb.steer, air: hb.air }); }
    else follow(v, b, dt, now, false);
    placeSki(v.g, v.x, v.y, v.z, v.h, v.pitch, -(v.steer || 0) * 0.35); wake(v, dt);
  }
  for (const [id, v] of views) if (!seen.has(id)) { scene.remove(v.g); views.delete(id); }
  if (!me.g) me.g = makeSki(myColor, "");
  placeSki(me.g, me.x, me.y, me.z, me.h, me.pitch || 0, -(me.steer || 0) * 0.35); wake(me, dt);
  // buoys bob; the arrow floats over my next gate
  for (const b of buoys) { b.m.position.y = seaY(b.x, b.z) - 0.4; b.m.rotation.z = Math.sin(now / 700 + b.x) * 0.08; }
  const ng = GATES[me.gi % GATES.length]; arrow.visible = !ATTRACT && !me.ft; arrow.position.set(ng.x, 7 + Math.sin(now / 250) * 0.6, ng.z); arrow.rotation.y += dt * 2;
  tickParts(dt);
  // chase camera
  camH = angle(camH + angle(me.h - camH) * Math.min(1, dt * 3.5));
  const back = camera.aspect < 1 ? 11 : 9, up = camera.aspect < 1 ? 6 : 4.6;
  camPos.set(me.x - Math.sin(camH) * back, Math.max(me.y, 0) * 0.6 + up, me.z - Math.cos(camH) * back);
  camera.position.lerp(camPos, 1 - Math.pow(0.0002, dt));
  me.shake = Math.max(0, (me.shake || 0) - dt * 3);
  if (me.shake) camera.position.add(camLook.set(Math.random() - 0.5, Math.random() - 0.5, Math.random() - 0.5).multiplyScalar(me.shake * 0.8));
  camLook.set(me.x + Math.sin(camH) * 8, me.y * 0.7 + 1.5, me.z + Math.cos(camH) * 8);
  camera.lookAt(camLook);
  const fov = (camera.aspect < 1 ? 80 : 68) + clamp(Math.hypot(me.vx, me.vz) / CONFIG.vmax, 0, 1.2) * 6;
  camera.fov += (fov - camera.fov) * Math.min(1, dt * 4); camera.updateProjectionMatrix();
  renderer.render(scene, camera);
  if (r && now - lastHud > 100) { lastHud = now; hud(r, now); }
}

(async function start() {
  net = await connect();
  net.onState((st) => { S = st; });
  net.on("again", () => again());
  net.onDisconnect(() => { dropped = true; $("net").textContent = "Reconnecting…"; });
  net.onReconnect(() => { dropped = false; });
  if (!net.offline && typeof MP !== "undefined") board = MP.auth({ key: MP_CONNECT.key, apiUrl: MP_CONNECT.apiUrl }).leaderboard(CONFIG.board);
  const taken = new Set([...Object.entries(S.entities.players || {}).filter(([id]) => id !== net.sessionId).map(([, p]) => p.c), ...shared("bots", []).map((b) => b.c)]);
  myColor = COLORS.find((c) => !taken.has(c)) || COLORS[Math.floor(Math.random() * COLORS.length)];
  net.me.set({ n: myName, c: myColor, hb: Date.now() });
  if (ATTRACT) Object.assign(CONFIG, { countdown: 1500, resultsFor: 1500, seats: 6 });
  started = performance.now();
  if (new URLSearchParams(location.search).has("test")) window.__test = { race, botList, me, racers }; // for test scripts only
  requestAnimationFrame(frame);
})();
</script>
</body>
